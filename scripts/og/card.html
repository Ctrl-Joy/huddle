<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600..900&display=block">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:Inter,sans-serif;color:#fff;background:linear-gradient(180deg,#0e0936 0%,#1a1066 45%,#26157f 100%);-webkit-font-smoothing:antialiased}
.card{position:absolute;inset:0;padding:80px 92px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:20px}
.brand svg{width:64px;height:64px}
.brand span{font-family:Unbounded,sans-serif;font-weight:700;font-size:38px;letter-spacing:-0.01em}
h1{margin-top:auto;font-family:Unbounded,sans-serif;font-weight:800;text-transform:uppercase;font-size:76px;line-height:1;letter-spacing:-0.015em}
h1 span{display:block}
.grad{background:linear-gradient(92deg,#5df2d6 0%,#a8f0ff 30%,#c4b1ff 62%,#ff9bd2 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:6px}
p{margin-top:30px;font-size:28px;line-height:1.4;color:rgba(230,226,255,.78);max-width:880px}
.foot{position:absolute;right:92px;top:96px;font-size:22px;font-weight:550;color:rgba(230,226,255,.6);letter-spacing:.01em}
</style></head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="#14b8a6"/><circle cx="18" cy="21" r="8" fill="#06201d" opacity=".9"/><circle cx="30" cy="21" r="8" fill="#06201d" opacity=".6"/><circle cx="24" cy="30" r="8" fill="#06201d" opacity=".35"/></svg>
    <span>Huddle</span>
  </div>
  <h1><span>Your people.</span><span>Your space.</span><span class="grad">Let’s huddle.</span></h1>
  <p>Text channels, drop-in voice, video and screen sharing for your groups. Right in your browser.</p>
  <div class="foot">huddlechat.duckdns.org</div>
</div>
</body></html>
