<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="bye!">
<style>
.buddy{animation:bob 2.4s ease-in-out infinite;transform-origin:160px 270px}
.wave{animation:wave 1.1s ease-in-out infinite;transform-origin:236px 168px}
.twinkle{animation:twinkle 1.6s ease-in-out infinite}
.float{animation:float 2.2s ease-in-out infinite}
.drip{animation:drip 1.4s ease-in infinite}
.bob2{animation:float 1.8s ease-in-out infinite}
.dash{animation:dash .7s linear infinite}
.zoom{animation:float 1s ease-in-out infinite}
.steam{animation:twinkle 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(22deg)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes dash{0%{transform:translateX(0)}100%{transform:translateX(-10px)}}
.pop{animation:pop 1.2s ease-in-out infinite;transform-origin:160px 70px}
.flicker{animation:flicker .6s ease-in-out infinite alternate;transform-origin:262px 150px}
@keyframes pop{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}
@keyframes flicker{from{transform:scale(1,1)}to{transform:scale(.94,1.06)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g class="buddy">
<path d="M160 80q-4-30 18-44" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
<path d="M160 78C236 78 270 126 270 184 270 242 226 270 160 270 94 270 50 242 50 184 50 126 84 78 160 78Z" fill="#fff" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
<ellipse cx="122" cy="272" rx="26" ry="14" fill="#735ba6" stroke="#fff" stroke-width="6"/>
<ellipse cx="198" cy="272" rx="26" ry="14" fill="#735ba6" stroke="#fff" stroke-width="6"/>
<path d="M160 80q-4-30 18-44" fill="none" stroke="#735ba6" stroke-width="6" stroke-linecap="round"/>
<path d="M178 36q26-12 38 6-24 14-38-6Z" fill="#5fd38d" stroke="#735ba6" stroke-width="4" stroke-linejoin="round"/>
<path d="M160 78C236 78 270 126 270 184 270 242 226 270 160 270 94 270 50 242 50 184 50 126 84 78 160 78Z" fill="#b18cff" stroke="#735ba6" stroke-width="5"/>
<ellipse cx="124" cy="112" rx="34" ry="14" fill="#ccb4ff" opacity=".7" transform="rotate(-20 124 112)"/>
<ellipse cx="102" cy="198" rx="15" ry="9" fill="#ff7a93" opacity=".45"/>
<ellipse cx="218" cy="198" rx="15" ry="9" fill="#ff7a93" opacity=".45"/>
<path d="M112 168q14 10 28 0M180 168q14 10 28 0" fill="none" stroke="#2b2340" stroke-width="7" stroke-linecap="round"/>
<path d="M144 200q16 16 32 0" fill="none" stroke="#2b2340" stroke-width="7" stroke-linecap="round"/>
</g>
<g class="wave"><circle cx="262" cy="128" r="17" fill="#b18cff" stroke="#735ba6" stroke-width="4"/><path d="M286 96q12 10 10 26M296 84q18 16 14 40" fill="none" stroke="#2b2340" stroke-width="5" stroke-linecap="round" opacity=".6"/></g>
<g transform="rotate(-6 160 290)">
<rect x="104.5" y="264" width="111" height="50" rx="25" fill="#fff" stroke="#2b2340" stroke-width="5"/>
<text x="160" y="299" text-anchor="middle" font-family="'Trebuchet MS', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="900" fill="#2b2340">bye!</text>
</g>
</svg>
